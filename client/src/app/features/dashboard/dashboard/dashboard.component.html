<main class="dashboard-shell">
  <section class="dashboard-card">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Welcome back</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <p *ngIf="user$ | async as user">You are signed in as {{ user.email }}.</p>
        <p *ngIf="!(user$ | async)">Your account is active and ready.</p>
      </mat-card-content>

      <mat-card-actions class="dashboard-actions">
        <a mat-stroked-button color="primary" routerLink="/">Home</a>
        <button mat-flat-button color="warn" type="button" (click)="logout()">Sign out</button>
      </mat-card-actions>
    </mat-card>
  </section>
</main>
