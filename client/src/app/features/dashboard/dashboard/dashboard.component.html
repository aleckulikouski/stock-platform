<main class="dashboard-shell">
  <section class="dashboard-card">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Welcome back</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        @if (user$ | async; as user) {
          <p>You are signed in as {{ user.email }}.</p>
        }
        @if (!(user$ | async)) {
          <p>Your account is active and ready.</p>
        }
      </mat-card-content>

      <mat-card-actions class="dashboard-actions">
        <a mat-stroked-button color="primary" routerLink="/watchlists">Watchlists</a>
        <a mat-stroked-button color="primary" routerLink="/portfolio">Portfolio</a>
        <button mat-flat-button color="warn" type="button" (click)="logout()">Sign out</button>
      </mat-card-actions>
    </mat-card>
  </section>
</main>
